name: getbalanceai_mobile
description: A new Flutter project for family budget management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  path_provider: ^2.1.2
  path: ^1.9.0
  objectbox: ^4.0.0
  objectbox_flutter_libs: any
  dio: ^5.11.1
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.3
  uuid: ^4.5.1
  flutter_bloc: ^9.1.1
  font_awesome_flutter: ^10.9.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  objectbox_generator: any
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/google_fonts/
    - assets/images/
