name: family_budget
description: A new Flutter project for family budget management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  path_provider: ^2.1.2
  path: ^1.9.0
  objectbox: ^4.0.0
  objectbox_flutter_libs: any
  dio: ^5.11.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  objectbox_generator: any

flutter:
  uses-material-design: true
  assets:
    - .env
